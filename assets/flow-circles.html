<script>
(() => {
  const DURATION = 20000; // ms
  const DRAW_DURATION = 19000; // ms
  const NODE_REVEAL_TIME = 180; // ms
  const BRANCH_HANDOFF_TIME = 90; // ms
  const FLOW_RISE = 0.4;
  const MAX_BACKTRACK = 160; // distance along the bottom-left → top-center axis
  const NETWORK_END = DRAW_DURATION - NODE_REVEAL_TIME;
  const SEED_KEY = '110,760';
  const paths = [...document.querySelectorAll('.flow-path')];
  const circles = [...document.querySelectorAll('.flow-node')];
  const stage = document.getElementById('flow-stage');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  const clamp = value => Math.max(0, Math.min(1, value));
  const pointKey = (x, y) => `${Number(x)},${Number(y)}`;
  const flowProgress = circle =>
    Number(circle.getAttribute('cx')) - Number(circle.getAttribute('cy')) * FLOW_RISE;
  const circleByKey = new Map(circles.map(circle => {
    const key = pointKey(circle.getAttribute('cx'), circle.getAttribute('cy'));
    return [key, circle];
  }));
  const edges = [];
  for (const path of paths) {
    const points = path.getAttribute('d').match(
      /^M([\d.-]+),([\d.-]+)\s+C.*\s([\d.-]+),([\d.-]+)$/
    );
    const start = points && circleByKey.get(pointKey(points[1], points[2]));
    const end = points && circleByKey.get(pointKey(points[3], points[4]));
    if (start && end) edges.push({ path, start, end });
  }

  const adjacency = new Map(circles.map(circle => [circle, []]));
  for (const edge of edges) {
    adjacency.get(edge.start).push(edge);
    adjacency.get(edge.end).push(edge);
  }

  const seed = circleByKey.get(SEED_KEY);
  const unvisited = new Set(circles);
  for (const circle of circles) circle.flowDistance = Infinity;
  seed.flowDistance = 0;
  while (unvisited.size) {
    let current = null;
    for (const circle of unvisited) {
      if (!current || circle.flowDistance < current.flowDistance) current = circle;
    }
    if (!current || !Number.isFinite(current.flowDistance)) break;
    unvisited.delete(current);
    for (const edge of adjacency.get(current)) {
      const next = edge.start === current ? edge.end : edge.start;
      if (!unvisited.has(next)) continue;
      const backtrack = Math.max(0, flowProgress(current) - flowProgress(next));
      if (backtrack > MAX_BACKTRACK) continue;
      const customWeight = edge.path.getAttribute('data-flow-weight');
      const sourceGap = Math.abs(
        Number(current.dataset.delay) - Number(next.dataset.delay)
      );
      const edgeWeight = customWeight === null
        ? Math.max(0.08, sourceGap)
        : Number(customWeight);
      const directionPenalty = 1 + (backtrack / MAX_BACKTRACK) * 1.5;
      const distance = current.flowDistance + edgeWeight * directionPenalty;
      if (distance < next.flowDistance) next.flowDistance = distance;
    }
  }

  const furthest = Math.max(...circles.map(circle => circle.flowDistance));
  const timelineScale = NETWORK_END / furthest;
  for (const circle of circles) {
    circle.flowArrival = circle.flowDistance * timelineScale;
  }

  for (const edge of edges) {
    const forward = edge.start.flowArrival <= edge.end.flowArrival;
    let from = forward ? edge.start : edge.end;
    let to = forward ? edge.end : edge.start;
    const backtrack = flowProgress(from) - flowProgress(to);
    const decorative = backtrack > MAX_BACKTRACK;
    if (decorative) {
      const startIsBehind = flowProgress(edge.start) <= flowProgress(edge.end);
      from = startIsBehind ? edge.start : edge.end;
      to = startIsBehind ? edge.end : edge.start;
    }
    const interval = to.flowArrival - from.flowArrival;
    const handoff = from === seed
      ? BRANCH_HANDOFF_TIME
      : Math.min(BRANCH_HANDOFF_TIME, interval * 0.25);
    edge.path.flowFrom = from;
    edge.path.flowTo = to;
    edge.path.flowDecorative = decorative;
    edge.path.flowReverse = edge.start !== from;
    edge.path.flowStart = decorative
      ? Math.max(from.flowArrival, to.flowArrival)
      : from.flowArrival + handoff;
    edge.path.flowDuration = decorative
      ? BRANCH_HANDOFF_TIME
      : interval > 1
        ? Math.max(1, interval - handoff)
        : BRANCH_HANDOFF_TIME;
  }

  const started = performance.now();
  function render(now) {
    const elapsed = (now - started) % DURATION;
    for (const path of paths) {
      const p = clamp((elapsed - path.flowStart) / path.flowDuration);
      path.style.strokeDashoffset = String((path.flowReverse ? -1 : 1) * (1 - p));
      path.style.opacity = elapsed < path.flowStart ? '0' : '1';
    }
    for (const circle of circles) {
      const p = clamp((elapsed - circle.flowArrival) / NODE_REVEAL_TIME);
      const eased = 1 - Math.pow(1 - p, 3);
      circle.style.opacity = String(eased);
      circle.style.transform = `scale(${0.45 + eased * 0.55})`;
    }
    stage.style.opacity = String(
      elapsed > DRAW_DURATION
        ? 1 - (elapsed - DRAW_DURATION) / (DURATION - DRAW_DURATION)
        : 1
    );
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
